[gcode_macro NOZZLE_PRIME]
description: Purge nozzle at the start of the print, for 0.4mm nozzle
variable_y_startheight: 15
variable_extrude_length: 30.0
variable_extrude_pre_length: 10.0
gcode:
  {% set extrude_length = params.EXTRUDE_LENGTH|default(printer["gcode_macro NOZZLE_PRIME"].extrude_length)|float %}
  {% set extrude_pre_length = params.EXTRUDE_PRE_LENGTH|default(printer["gcode_macro NOZZLE_PRIME"].extrude_pre_length)|float %}

  {% set rand = range(0, (printer.toolhead.axis_maximum.x|int  - 1))|random %}
  RESPOND PREFIX=🏌️ MSG="NOZZLE_PRIME fuzzy Coord(x={rand})"
  {% set fan_speed = printer.fan.speed %}
  G90                                                                   # set absolute positioning
  G0 X{rand} Y{y_startheight} F3000
  PART_COOLING SPEED=1.0
  SAFE_EXTRUDE
  G90                                                                   # set absolute positioning
  M83
  RESPOND PREFIX=🍦 MSG="NOZZLE_PRIME Extruding: {extrude_length}mm"
  G0 E{extrude_pre_length} Y0 Z8 F300
  G91                                                                   # set relative positioning
  G0 Z+{extrude_length / 2} E+{extrude_length - extrude_pre_length} F150                                    # intro line
  G0 Y+15 Z+15 F3000                                                    # move Y axis up & retract
  M400
  G90                                                                   # set absolute positioning
  G92 E0 Z0                                                               # reset extruder and belt position
  PART_COOLING SPEED={fan_speed}