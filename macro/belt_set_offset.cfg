[gcode_macro Y_PLUS_01]
gcode:
  RESPOND PREFIX=📝 MSG="Y_Offset is now: ({ printer.gcode_move.homing_origin.y + 0.01 })"
  SET_GCODE_OFFSET Y_ADJUST=0.01
[gcode_macro Y_PLUS_005]
gcode:
  RESPOND PREFIX=📝 MSG="Y_Offset is now: ({ printer.gcode_move.homing_origin.y + 0.005 })"
  SET_GCODE_OFFSET Y_ADJUST=0.005
[gcode_macro Y_MINUS_01]
gcode:
  RESPOND PREFIX=📝 MSG="Y_Offset is now: ({ printer.gcode_move.homing_origin.y - 0.01 })"
  SET_GCODE_OFFSET Y_ADJUST=-0.01
[gcode_macro Y_MINUS_005]
gcode:
  RESPOND PREFIX=📝 MSG="Y_Offset is now: ({ printer.gcode_move.homing_origin.y - 0.005 })"
  SET_GCODE_OFFSET Y_ADJUST=-0.005