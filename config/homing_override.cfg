[homing_override]
axes: xyz
set_position_y: 25
gcode:
  {% set vars = printer["gcode_macro global_vars"] %}
  {% set y_offset = vars.y_offset|default(-0.5) %}
  {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
  {% set x_mid = printer.toolhead.axis_maximum.x/2|float %}
  {% set fuzz = range(-10, 11) | random %}							# Add +/-10mm to X axis value for middle of bed
  #{% set fuzz = 0 %}												# Add 0mm of to X axis value for middle of bed

  {% set probe_temp = 150 %}                     # Setting the print head temperature 150
  {% set max_temp = probe_temp + 5 %}            # Limit temperature +5 degrees
  {% set actual_temp = printer.extruder.temperature %}                   
  {% set target_temp = printer.extruder.target %}                    
	                   
  {% if target_temp > probe_temp %}              # Checking the temperature
    RESPOND PREFIX=📝 MSG="Extruder temperature target of {target_temp | round(1)}C is too high, lowering to {probe_temp | round(1)}C"
    M109 S{ probe_temp }
  {% else %}
    {% if actual_temp > max_temp %}                # Judging the actual temperature
      RESPOND PREFIX=🫸 MSG="Extruder temperature { actual_temp | round(1) }C is still too high, waiting until below { max_temp | round(1) }C"
      TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={ max_temp }
    {% endif %}
  {% endif %}

  {% if "y" not in printer.toolhead.homed_axes %}
    G91                    # Relative Mode  
    G1 Y10 F500            # Try to move Y 10 mm away from the bed for good measure
    G90                    # Absolute Mode
  {% endif %}
  {% if home_all or 'X' in params %}
    G28 X                  # Home X first, because we want to be able to go to hit a point on the bed
    RESPOND PREFIX=🏌️ MSG="homing_override fuzz Coord(x={x_mid+fuzz})"
    G0 X{x_mid+fuzz} F2000           # Move to the middle of the bed with added fuzz range
  {% endif %}
  {% if home_all or 'Y' in params %}
    _SET_HOMING_CURRENT CURRENT=.20
    G28 Y 
    _RESTORE_RUN_CURRENT 
    SET_GCODE_OFFSET Y={y_offset} # Diagnostic, because we seem to be homing and then thinking 7.5mm away is actually 0... so if we tell it we're at 7.5, 0 should be correct right?
    RESPOND PREFIX=📃 MSG="y offset set to: {y_offset}"
  {% endif %}
  {% if home_all or 'Z' in params %}
    G28 Z    
  {% endif %}
  SET_GCODE_VARIABLE MACRO=KINEMATICS_RESET VARIABLE=reset_enabled VALUE=0

  M104 S{target_temp}                                                        # preheat nozzle to target_temp
  TEMPERATURE_WAIT SENSOR=extruder MINIMUM={target_temp}                     # 