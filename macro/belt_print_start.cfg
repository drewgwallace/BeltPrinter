[gcode_macro PRINT_START]
gcode:
  {% set BED = params.BED|int %}
  {% set EXTRUDER = params.EXTRUDER|int %}
  {% set MATERIAL = params.MATERIAL|string %}
  {% set ANGLE = params.ANGLE|string %}

  SET_GCODE_VARIABLE MACRO=Y_ANGLE VARIABLE=angle VALUE={ANGLE}

  MOTION_SENSOR ENABLE=0                                                    # disable motion_sensor
  SWITCH_SENSOR ENABLE=1

  _VALIDATE_ANGLE

  {% if printer["gcode_macro _VALIDATE_ANGLE"].validation_error == 0 %}
    RESPOND PREFIX=📃 MSG="Home All"
    G28                                                                     # home all axis

    M104 S150                                                               # preheat nozzle to 150C
    M117 Heating Bed
    M190 S{BED}                                                             # heat bed

    G91                                                                   # set relative positioning
    G0 Z+5
    G90                                                                   # set absolute positioning

    RESPOND PREFIX=📃 MSG="Home Y"
    G28 Y

    M117 Heating Nozzle
    M104 S{EXTRUDER}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={EXTRUDER}                     # heat nozzle
    M117 #Clear message

    NOZZLE_PRIME
    G0 Z5 F3000
    G21 # set units to millimeters
    G90 # use absolute coordinates
    M83 # use relative distances for extrusion

    UPDATE_DELAYED_GCODE ID=ENABLE_MOTION_SENSOR DURATION=60                # enable sensor in 60 seconds
  {% else %}
    CANCEL_PRINT
  {% endif %}