[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_etemp: 0
gcode:
  RESPOND PREFIX=🫡 MSG="Resuming print job"

  {% if printer['pause_resume'].is_paused|int == 1 %}
    SWITCH_SENSOR ENABLE={printer["gcode_macro SWITCH_SENSOR"].fswitch_enabled}                          ; enable filament sensor
    MOTION_SENSOR ENABLE={printer["gcode_macro MOTION_SENSOR"].fmotion_enabled}                          ; enable filament motion sensor
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}             ; set timeout back to configured value

    {% if printer["gcode_macro PAUSE_AT_NEXT_OBJ"].repetition_pause == 1 %}
      M104 S150                                                                              # preheat nozzle to etemp
      TEMPERATURE_WAIT SENSOR=extruder MINIMUM=150                                           #
      SET_GCODE_VARIABLE MACRO=PAUSE_AT_NEXT_OBJ VARIABLE=repetition_pause VALUE=0

      RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=60                                      ; restore position
      M400

      {% if printer["gcode_macro _REPETITION"].repetition_in_use == 1 %}
        _REPETITION_CYCLE
      {% elif printer["gcode_macro _EM_CALIBRATE_REPETITION"].em_calibration_repetition_in_use == 1 %}
        EM_CALIBRATE_REPETITION_CYCLE
      {% else %}
        RESPOND PREFIX=❗ MSG="This shouldn't happen, there's an issue in repetition!"
	  {% endif %}

      {% if etemp > 0 %}
        M104 S{etemp|int}                                                                     # preheat nozzle to etemp
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={etemp|int}                                  #
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE=0
      {% endif %}

      SAFE_EXTRUDE
      NOZZLE_PRIME EXTRUDE_LENGTH=15 EXTRUDE_PRE_LENGTH=5
      BASE_RESUME                                                                   ; resume print
      
	  G92 E0 Z0																		# reset extruder and belt position before "repetition"

      G21                                                                           # set units to millimeters
      G90                                                                           # use absolute coordinates
      M83                                                                           # use relative distances for extrusion

    {% else %}
      {% if etemp > 0 %}
        M104 S{etemp|int}                                                                # preheat nozzle to etemp
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={etemp|int}                             #
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE=0
      {% endif %}

      SAFE_EXTRUDE
      RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=60                                 ; restore position

      BASE_RESUME                                                                        ; resume print

      G21                                                                           # set units to millimeters
      G90                                                                           # use absolute coordinates
      M83                                                                           # use relative distances for extrusion
    {% endif %}
  {% endif %}