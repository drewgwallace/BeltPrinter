[gcode_macro _REPETITION]
description: When using ideaMaker's "Repetition" mode, call this macro from Template -> GCode -> Repetition GCode
variable_count: 1                                                                       # start reporting at end of part number 1
variable_home_between_obj: 1
variable_repetition_in_use: 0
variable_spacing: 25
gcode:
  SET_GCODE_VARIABLE MACRO=_REPETITION VARIABLE=repetition_in_use VALUE=1
  G91                                                                                   # relative mode
  G0 Z{spacing} F20000                                                                  # advance the belt spacing distance from the nozzle
  M400

  {% if printer["gcode_macro CANCEL_AT_NEXT_OBJ"].repetition_cancel == 1 %}
    RESPOND PREFIX=❗ MSG="Canceling print job, there have been {count} objects completed."
    _REPETITION_RESET
    CANCEL_PRINT

  {% elif printer["gcode_macro PAUSE_AT_NEXT_OBJ"].repetition_pause == 1 %}
    RESPOND PREFIX=❗ MSG="Pausing printer, there have been {count} objects completed."
    PAUSE

  {% else %}
    _REPETITION_CYCLE
  {% endif %}

[gcode_macro _EM_CALIBRATE_REPETITION]
description: When using ideaMaker's "Repetition" mode, and calibrating EM/flow, call this macro from Template -> GCode -> Repetition GCode
variable_count: 1                                                                       # start reporting at end of part number 1
variable_em: 1.0
variable_em_calibration_repetition_in_use: 0
variable_em_steps: 0.02
variable_home_between_obj: 1
variable_spacing: 12
gcode:
  {% set steps   = params.EM_STEPS|default(printer["gcode_macro _EM_CALIBRATE_REPETITION"].em_steps) | float %}
  SET_GCODE_VARIABLE MACRO=_EM_CALIBRATE_REPETITION VARIABLE=em_calibration_repetition_in_use VALUE=1
  G91                                                                                   # relative mode
  G0 Z{spacing} F20000                                                                  # advance the belt spacing distance from the nozzle
  M400

  {% if printer["gcode_macro CANCEL_AT_NEXT_OBJ"].repetition_cancel == 1 %}
    RESPOND PREFIX=❗ MSG="Canceling print job, there have been {count} objects completed."
    _REPETITION_RESET
    CANCEL_PRINT

  {% elif printer["gcode_macro PAUSE_AT_NEXT_OBJ"].repetition_pause == 1 %}
    RESPOND PREFIX=❗ MSG="Pausing printer, there have been {count} objects completed."
    PAUSE

  {% else %}
    {% if em - em_steps <= 0 %}
      RESPOND PREFIX=⚠ MSG="EM calibration dropped to zero. Stopping repetition mode."
      CANCEL_PRINT

    {% else %}
      EM_CALIBRATE_REPETITION_CYCLE EM_STEPS={steps}
    {% endif %}
  {% endif %}

[gcode_macro _REPETITION_CYCLE]
gcode:
  {% set updated_count = printer["gcode_macro _REPETITION"].count + 1 %}

  {% if printer["gcode_macro _REPETITION"].home_between_obj == 1 %}
    G28 Y                                                                               # home y to recalibrate nozzle distance between repetition
  {% endif %}

  RESPOND PREFIX=🔄 MSG="Next Object • Count: {updated_count}"
  SET_GCODE_VARIABLE MACRO=_REPETITION VARIABLE=count VALUE={updated_count}
  G92 E0 Z0                                                                             # reset extruder and belt position before "repetition"
  G90

[gcode_macro EM_CALIBRATE_REPETITION_CYCLE]
gcode:
  {% if params.EM_STEPS is defined %}
    {% set steps = params.EM_STEPS | float %}
    SET_GCODE_VARIABLE MACRO=_EM_CALIBRATE_REPETITION VARIABLE=em_steps VALUE={steps}
  {% else %}
    {% set steps = printer["gcode_macro _EM_CALIBRATE_REPETITION"].em_steps | float %}
  {% endif %}

  {% set old_em = printer["gcode_macro _EM_CALIBRATE_REPETITION"].em | float %}

  {% if printer["gcode_macro _EM_CALIBRATE_REPETITION"].count == 1 %}
    RESPOND PREFIX=👉 MSG="Completed first object at EM value {printer.gcode_move.extrude_factor}, updating repetition"
    SET_GCODE_VARIABLE MACRO=_EM_CALIBRATE_REPETITION VARIABLE=em VALUE={printer.gcode_move.extrude_factor} # Set EM to starting value from slicer on first pass
    {% set old_em = printer.gcode_move.extrude_factor | float %}
  {% endif %}

  SET_GCODE_VARIABLE MACRO=_EM_CALIBRATE_REPETITION VARIABLE=em VALUE={old_em - steps}

  {% set updated_em = old_em - steps | float %}

  {% set updated_count = printer["gcode_macro _EM_CALIBRATE_REPETITION"].count + 1 | int %}
  {% set updated_em = old_em - steps | float %}

  {% if printer["gcode_macro _EM_CALIBRATE_REPETITION"].home_between_obj == 1 %}
    G28 Y                                                                               # home y to recalibrate nozzle distance between repetition
  {% endif %}

  G92 E0 Z0                                                                             # reset extruder and belt position before "repetition"
  M221 S{updated_em * 100}
  G90
  SET_GCODE_VARIABLE MACRO=_EM_CALIBRATE_REPETITION VARIABLE=count VALUE={updated_count}
  RESPOND PREFIX=🔄 MSG="Next Object • Count: {updated_count} @ EM: {updated_em}"

[gcode_macro PAUSE_AT_NEXT_OBJ]
variable_repetition_pause: 0
gcode:
  SET_GCODE_VARIABLE MACRO=PAUSE_AT_NEXT_OBJ VARIABLE=repetition_pause VALUE=1

[gcode_macro CANCEL_AT_NEXT_OBJ]
variable_repetition_cancel: 0
gcode:
  SET_GCODE_VARIABLE MACRO=CANCEL_AT_NEXT_OBJ VARIABLE=repetition_cancel VALUE=1

[gcode_macro _REPETITION_RESET]
gcode:
  SET_GCODE_VARIABLE MACRO=CANCEL_AT_NEXT_OBJ VARIABLE=repetition_cancel VALUE=0
  SET_GCODE_VARIABLE MACRO=PAUSE_AT_NEXT_OBJ VARIABLE=repetition_pause VALUE=0
  SET_GCODE_VARIABLE MACRO=_EM_CALIBRATE_REPETITION VARIABLE=count VALUE=1
  SET_GCODE_VARIABLE MACRO=_EM_CALIBRATE_REPETITION VARIABLE=em_calibration_repetition_in_use VALUE=0
  SET_GCODE_VARIABLE MACRO=_REPETITION VARIABLE=repetition_in_use VALUE=0